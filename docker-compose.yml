services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8081:8080"   # 8081 no host (o serviço de usuário usa 8080); 8080 dentro do container
    environment:
      # Estas variáveis sobrescrevem o application.properties (que aponta para localhost)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/biblioteca
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Garante 8080 dentro do container, mesmo que o properties tenha server.port=8081
      SERVER_PORT: 8080
      # Mesmo valor do serviço de usuário. Vem do arquivo .env
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: